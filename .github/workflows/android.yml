name: Android CI

# Запускается только когда в репозитории уже есть Gradle-проект.
# До генерации проекта workflow просто не срабатывает и не засоряет PR красными галочками.
on:
  push:
    branches: [Main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties']
  pull_request:
    branches: [Main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finney-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
