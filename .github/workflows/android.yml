name: Android CI

# push в Main собирается, только если менялся код или сборка.
# PR в Main проверяется всегда, без фильтра paths: проверка `build` обязательна для
# слияния, и PR, который трогает только docs/ или JSON, без неё не получил бы
# зелёную галочку и не слился бы никогда.
on:
  push:
    branches: [Main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties']
  pull_request:
    branches: [Main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 25 — та же версия, что требует gradle/gradle-daemon-jvm.properties,
      # иначе Gradle на каждом прогоне докачивает JDK сам.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      # Эмулятора в CI нет, но сборка ловит ошибки, из-за которых
      # инструментальные тесты не доходят до устройства, — например имена
      # методов с пробелами: DEX до версии 040 их не принимает.
      - name: Build instrumented tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finney-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
